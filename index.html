    .garden {
      position: relative;
      width: 100%;
      max-width: 980px;
      height: 460px;
      background: radial-gradient(circle at center, transparent, transparent);
      box-shadow: none;

   /* Sombras suaves en los pétalos */

          .flower {
            animation: shadowPulse 12s infinite alternate;

      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      z-index: 5;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
    }

    .flower:active {
      cursor: grabbing;
      z-index: 30;
      filter: brightness(1.15);
    }

    /* Contenedor de pétalos */
    .petals {
      position: relative;
      width: 90px;
      height: 90px;
      pointer-events: none;
    }

    /* Pétalos más orgánicos y redondeados flor normal */
    .petala {
      position: absolute;
      width: 40px;
      height: 45px;
      background: radial-gradient(
        ellipse at 80% 0%,
        #ff9a9a 0%,
        #ad0f0f 45%,
        #cc0000 80%,
        #350f0f 100%
      );
      border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
      box-shadow:
        0 0 18px rgba(78, 20, 20, 0.9),
        0 0 35px rgba(255, 0, 0, 0.6),
        inset 0 0 12px rgba(255, 180, 180, 0.35);
      transform-origin: 50% 90%;
    }

    /* Distribución de los 6 pétalos flor normal */
    .petala:nth-child(1) { top: 12%;  left: 32px; transform: rotate(0deg); }
    .petala:nth-child(2) { top: 12px; left: 40px; transform: rotate(60deg); }
    .petala:nth-child(3) { top: 30px; left: 40px; transform: rotate(120deg); }
    .petala:nth-child(4) { top: 26px; left: 29px; transform: rotate(180deg); }
    .petala:nth-child(5) { top: 25px; left: 20px;  transform: rotate(240deg); }
    .petala:nth-child(6) { top: 8px;  left: 24px; transform: rotate(300deg); }

    
    /* Pétalos más orgánicos y redondeados flor normal */
        .petalb {
      position: absolute;
      width: 20px;
      height: 23px;
      background: radial-gradient(
        ellipse at 80% 0%,
        #ff9a9a 0%,
        #ad0f0f 45%,
        #cc0000 80%,
        #350f0f 100%
      );
      border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
      box-shadow:
        0 0 18px rgba(10, 10, 10, 0.9),
        0 0 35px rgba(255, 0, 0, 0.6),
        inset 0 0 12px rgba(255, 180, 180, 0.35);
      transform-origin: 50% 90%;
    }

    /* Distribución de los 16 pétalos flor normal */

    .petalb:nth-child(15) { top: 42px; left: 48px; transform: rotate(90deg); }
    .petalb:nth-child(14) { top: 50px; left: 40px; transform: rotate(180deg); }
    .petalb:nth-child(13) { top: 41px; left: 31px; transform: rotate(-90deg); }

    .petalb:nth-child(8) { top: 57px; left: 47px; transform: rotate(150deg); }

    .petalb:nth-child(6) { top: 27px;  left: 48px; transform: rotate(40deg); }
    .petalb:nth-child(5) { top: 27%;  left: 34px; transform: rotate(-30deg); }
    .petalb:nth-child(4) { top: 38px; left: 60px; transform: rotate(75deg); }

    /* Pétalos más orgánicos y redondeados flor normal */
        .petalc {
      position: absolute;

   /* Distribución de los 8 pétalos flor normal */

            /* Animación LED */
@keyframes ledGlow {
  0% {
    background: radial-gradient(
      ellipse at 80% 0%,
      #e6ccff 0%,
      #b366ff 45%,
      #8000cc 80%,
      #0d0614 100%
    );
    filter: drop-shadow(0 0 8px #b366ff);
  }

  33% {
    background: radial-gradient(
      ellipse at 80% 0%,
      #c77dff 0%,
      #8000cc 45%,
      #4b0082 80%,
      #08000d 100%
    );
    filter: drop-shadow(0 0 12px #8000cc);
  }

  66% {
    background: radial-gradient(
      ellipse at 80% 0%,
      #6b3a80 0%,
      #301044 45%,
      #160a20 80%,
      #000000 100%
    );
    filter: drop-shadow(0 0 12px #4b0082);
  }

  100% {
    background: radial-gradient(
      ellipse at 80% 0%,
      #e6ccff 0%,
      #b366ff 45%,
      #8000cc 80%,
      #0d0614 100%
    );
    filter: drop-shadow(0 0 8px #b366ff);
  }
}

        /* Aplica la animación a los pétalos */
            .petala {
              animation: ledGlow 15s infinite alternate;
              animation-delay: 0s;   /* empieza en el primer color */
            }

            .petalb {
              animation: ledGlow 15s infinite alternate;
              animation-delay: -3.75s; /* empieza en el segundo color */
            }

            .petalc {
              animation: ledGlow 15s infinite alternate;
              animation-delay: -7.5s; /* empieza en el tercer color */
            }

      position: absolute;

        0 0 28px rgba(255, 150, 0, 0.7);

      width: 5px;
      height: 130px;
      background: linear-gradient(to bottom, #ff0800, #f36a52);
      border-radius: 1px;
      position: relative;
      margin-top: -8px;
      box-shadow: 0 0 10px rgba(255, 8, 8, 0.5);
      pointer-events: none;

    /* =========================================================
   PASTO EN LA BASE DE CADA RAMO
========================================================= */

.grass {
    position: absolute;
    bottom: -8px;
    left: 50%;
    width: 65px;
    height: 35px;
    transform: translateX(-50%);
    z-index: 1;
    pointer-events: none;
}

/* Cada hoja de pasto */
.grass span {
    position: absolute;
    bottom: 0;
    width: 5px;
    height: 25px;
    background: linear-gradient(
        to top,
        #123d24,
        #287a3d,
        #55a85b
    );
    border-radius: 100% 0 100% 0;
    transform-origin: bottom center;
}

/* Distribución del pasto */
        .grass span:nth-child(1) {
            left: 21px;
            height: 20px;
            transform: rotate(-35deg);
        }

        .grass span:nth-child(2) {
            left: 24px;
            height: 28px;
            transform: rotate(-22deg);
        }

        .grass span:nth-child(3) {
            left: 27px;
            height: 23px;
            transform: rotate(-10deg);
        }

        .grass span:nth-child(4) {
            left: 29px;
            height: 31px;
            transform: rotate(0deg);
        }

        .grass span:nth-child(5) {
            left: 32px;
            height: 25px;
            transform: rotate(10deg);
        }

        .grass span:nth-child(6) {
            left: 35px;
            height: 30px;
            transform: rotate(22deg);
        }

        .grass span:nth-child(7) {
            left: 39px;
            height: 20px;
            transform: rotate(35deg);
        }

    /* Hojas alargadas y ovaladas */
    .leaf {
      position: absolute;
      left: 200%;
      width: 12px;
      height: 50px;
      background: linear-gradient(to right, #ff0000, #f35221);
      border-radius: 50% 50% 50% 50% / 85% 85% 15% 15%;
      box-shadow: 0 0 7px rgba(59, 26, 18, 0.4);
      pointer-events: none;
    }

    .leaf.left {
      left: -20px;
      top: 28%;
      transform: rotate(-32deg);
      background: linear-gradient(to right, #ff0000, #f35221);
    }

    .leaf.right {
      right: -40px;
      top: 48%;
      transform: rotate(32deg) scaleX(-1); 
      background: linear-gradient(to right, #ff0000, #f35221);
    }

    /* Corazones flotantes */
      .heart {
        position: absolute;   /* antes estaba relative */
        bottom: 0;            /* arranca desde abajo */
        width: 11px;
        height: 11px;
        background: #ff4466;
        transform: rotate(45deg);
        opacity: 0.75;
        animation: float-up 8s ease-in infinite;
        box-shadow: 0 0 9px #ff2244;
        pointer-events: none;
      }


    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 11px;
      height: 11px;
      background: #ff4466;
      border-radius: 50%;
    }

    .heart::before { top: -5.5px; left: 0; }
    .heart::after  { top: 0; left: -5.5px; }

    .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 20%; animation-delay: 1s; }
    .heart:nth-child(3) { left: 30%; animation-delay: 2s; }
    .heart:nth-child(4) { left: 40%; animation-delay: 0s; }
    .heart:nth-child(5) { left: 50%; animation-delay: 1s; }
    .heart:nth-child(6) { left: 60%; animation-delay: 2s; }
    .heart:nth-child(7) { left: 70%; animation-delay: 0s; }
    .heart:nth-child(8) { left: 80%; animation-delay: 1s; }
    .heart:nth-child(9) { left: 25%; animation-delay: 2s; }
    .heart:nth-child(10) { left: 75%; animation-delay: 0s; }

    @keyframes float-up {
      0% {
        transform: translateY(0) rotate(45deg) scale(0.5);
        opacity: 0;
      }
      12% { opacity: 0.8; }
      100% {
        transform: translateY(-440px) rotate(45deg) scale(1.15);
        opacity: 0;
      }
    }


    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 75%, rgba(255, 25, 25, 0.13), transparent 65%);
      pointer-events: none;
      z-index: 1;
    }

<script>
      // Arrastrar flores (estilo Paint)
    const flowers = document.querySelectorAll('.flower');
    let isDragging = false;
    let currentFlower = null;
    let offsetX = 0;
    let offsetY = 0;

    flowers.forEach(flower => {
      flower.addEventListener('mousedown', (e) => {
        isDragging = true;
        currentFlower = flower;
        const rect = flower.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        flower.style.zIndex = 40;
        e.preventDefault();
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging || !currentFlower) return;

      const garden = document.getElementById('garden');
      const gardenRect = garden.getBoundingClientRect();

      let x = e.clientX - gardenRect.left - offsetX;
      let y = e.clientY - gardenRect.top - offsetY;

      // Limitar dentro del jardín
      x = Math.max(0, Math.min(x, gardenRect.width - 90));
      y = Math.max(0, Math.min(y, gardenRect.height - 160));

      currentFlower.style.left = x + 'px';
      currentFlower.style.top = y + 'px';
      currentFlower.style.bottom = 'auto';
    });

    document.addEventListener('mouseup', () => {
      if (currentFlower) currentFlower.style.zIndex = 5;
      isDragging = false;
      currentFlower = null;
    });
</script>

</body>
</html>
